
#Thuumcraft Books Loot Chances
[loot]
	#Chance for the following mobs to drop a random book (default is 1.0%):
	#zombie, skeleton, pillager, witch
	#Range: 0.0 ~ 1.0
	mobDropChance = 0.01
	#Chance for the following chests to contain a random book (default is 5%):
	#shipwreck (treasure and supply), simple dungeon, desert pyramid, jungle temple, woodland mansion ancient city, abandoned mineshaft, nether bridge, igloo chest, bastion (bridge, other, and treasure)
	#Range: 0.0 ~ 1.0
	chestDropChance = 0.05
	#Chance for fishing junk loot to include a random book (default is 3%)
	#Range: 0.0 ~ 1.0
	fishingDropChance = 0.03

#Skyrim-style HUD and stamina settings
[hudAndStamina]
	#Set to false to completely disable Thuumcraft's Skyrim-style HUD, stamina replacement, hunger override and Iron's Spellbooks mana bar replacement.
	enableSkyrimHudAndStamina = true
	#Render Thuumcraft's Skyrim-style HUD overlays. Individual bars can still be toggled below.
	enableSkyrimHud = true
	#Render the Skyrim-style compass at the top of the screen.
	showCompass = false
	#Render the targeted entity health bar.
	showTargetHealthBar = true
	#Render the Skyrim-style player health bar. If false, vanilla health is shown.
	showPlayerHealthBar = true
	#Render the Skyrim-style Iron's Spellbooks mana bar. If false, Iron's default mana overlay is shown.
	showManaBar = true
	#Render the Skyrim-style stamina bar.
	showStaminaBar = true
	#Render the Skyrim-style armor icons. If false, vanilla armor is shown.
	showArmorIcons = true
	#Render the Skyrim-style air icons. If false, vanilla air bubbles are shown.
	showAirIcons = true
	#Render the Skyrim-style experience bar. If false, vanilla experience is shown.
	showExperienceBar = true

	#Skyrim-style stamina system settings
	[hudAndStamina.stamina]
		#Enable stamina draining/regeneration and stamina-based sprint control.
		enableStaminaSystem = true
		#Keep vanilla hunger stable while stamina replaces hunger. Disable for vanilla hunger behavior.
		enableHungerOverride = true
		#Drain stamina while sprinting and prevent sprinting when stamina is too low.
		enableSprintLimit = true
		#Food level held by the hunger override. 17 prevents vanilla natural regeneration from running.
		#Range: 1 ~ 20
		hungerOverrideFoodLevel = 17
		#Base stamina drained per second while sprinting.
		#Range: 0.0 ~ 1000.0
		sprintDrainPerSecond = 5.0
		#Extra sprint stamina drain per armor point. 0.02 means 2% more drain per armor point.
		#Range: 0.0 ~ 10.0
		sprintArmorDrainMultiplier = 0.02
		#Minimum stamina ratio required to start sprinting.
		#Range: 0.0 ~ 1.0
		sprintStartStaminaRatio = 0.1
		#Stamina ratio required to unlock sprinting after running out.
		#Range: 0.0 ~ 1.0
		sprintResumeStaminaRatio = 0.15
		#Minimum absolute stamina required to start sprinting.
		#Range: 0.0 ~ 1000000.0
		sprintStartStaminaFloor = 5.0
		#Minimum absolute stamina required to unlock sprinting after running out.
		#Range: 0.0 ~ 1000000.0
		sprintResumeStaminaFloor = 10.0
		#Ticks before stamina starts regenerating after stamina is drained.
		#Range: 0 ~ 1200
		staminaRegenDelayTicks = 20
		#When Epic Fight is installed, make Epic Fight skills and dodges consume Thuumcraft stamina instead of Epic Fight's internal stamina.
		enableEpicFightStaminaReplacement = true

	#Skyrim-style health regeneration settings
	[hudAndStamina.healthRegeneration]
		#Enable passive percentage-based Skyrim-style health regeneration.
		enableHealthRegeneration = true
		#Out-of-combat health regenerated per second as a fraction of max health. Skyrim default is 0.007 (0.70%).
		#Range: 0.0 ~ 1.0
		outOfCombatPercentPerSecond = 0.007
		#In-combat health regenerated per second as a fraction of max health. Skyrim default is 0.0049 (0.49%).
		#Range: 0.0 ~ 1.0
		combatPercentPerSecond = 0.0049
		#How often health regeneration is applied. Lower values are smoother; 20 applies once per second.
		#Range: 1 ~ 1200
		healthRegenIntervalTicks = 20
		#Ticks a player remains in combat after dealing or taking damage.
		#Range: 0 ~ 12000
		combatDurationTicks = 200

	#Skyrim-style food effects settings
	[hudAndStamina.food]
		#Enable food restoring Skyrim-style health, stamina and occasional magicka, with soups/stews granting timed regeneration.
		enableFoodEffects = true
		#Health restored per Minecraft nutrition point when food is eaten.
		#Range: 0.0 ~ 1000.0
		healthRestorePerNutrition = 0.6
		#Stamina restored per Minecraft nutrition point when food is eaten.
		#Range: 0.0 ~ 1000.0
		staminaRestorePerNutrition = 3.0
		#Magicka restored per Minecraft nutrition point for magicka-themed foods.
		#Range: 0.0 ~ 1000.0
		magickaRestorePerNutrition = 0.75
		#Multiplier for direct food recovery from raw food.
		#Range: 0.0 ~ 10.0
		rawRestoreMultiplier = 0.5
		#Multiplier for direct food recovery from cooked food.
		#Range: 0.0 ~ 10.0
		cookedRestoreMultiplier = 1.25
		#Multiplier for direct food recovery from soups, stews and full meals.
		#Range: 0.0 ~ 10.0
		mealRestoreMultiplier = 1.5
		#Ticks soups, stews and full meals grant regeneration. Default 60 seconds (1200 ticks)
		#Range: 0 ~ 24000
		mealRegenDurationTicks = 14400
		#Health restored per second by soup/stew/full-meal regeneration.
		#Range: 0.0 ~ 1000.0
		mealHealthRegenPerSecond = 1.0
		#Stamina restored per second by soup/stew/full-meal regeneration.
		#Range: 0.0 ~ 1000.0
		mealStaminaRegenPerSecond = 1.0
		#Magicka restored per second by magicka-themed meal regeneration.
		#Range: 0.0 ~ 1000.0
		mealMagickaRegenPerSecond = 1.0

#Skyrim-style skill progression and perk tree settings
[skills]
	#Set to false to completely disable skill XP progression, character level, perk points, skill tree unlocking and perk ability effects.
	enableSkillSystem = true
	#Grant a Skyrim-style Well Rested bonus to skill XP after sleeping.
	enableRestedSkillXpBonus = true
	#Skill XP multiplier while Well Rested. Skyrim's Well Rested bonus is 10% faster skill improvement.
	#Range: 1.0 ~ 10.0
	restedSkillXpMultiplier = 1.1
	#Ticks the Well Rested skill XP bonus lasts after sleeping.
	#Range: 0 ~ 240000
	restedSkillXpDurationTicks = 24000

#Ranged combat tuning
[rangedCombat]
	#Enable faster, flatter player-fired arrow trajectories.
	enablePlayerArrowTrajectoryTuning = true
	#Player arrow velocity attribute multiplier. Higher values make arrows fly faster and drop less. Default 2.25 gives a much flatter Skyrim-like shot.
	#Range: 0.1 ~ 10.0
	playerArrowVelocityMultiplier = 3.0
	#Compensate the arrow damage attribute by the inverse velocity multiplier. At the default 2.25 velocity multiplier, arrow damage is multiplied by 0.4444 before other ranged bonuses so the faster arrow does not gain free damage from speed.
	preservePlayerArrowDamage = true

#Skyrim-style kill camera settings
[killCam]
	#Enable client-side cinematic kill cameras after the player lands a killing blow.
	enableKillCam = true
	#Chance for a valid killing blow to trigger a kill camera.
	#Range: 0.0 ~ 1.0
	chance = 0.25
	#Length of the client-side kill camera in ticks. This does not slow server or world time.
	#Range: 1 ~ 200
	durationTicks = 48
	#Minimum ticks between kill cameras for the same player.
	#Range: 0 ~ 12000
	cooldownTicks = 100
	#Only trigger when the kill leaves no nearby hostile mob actively targeting or recently hurt by the player. This approximates Skyrim's combat-ending killmove rule while still allowing undetected kills.
	requireLastThreat = true
	#Only trigger kill cameras when killing hostile mobs.
	hostileOnly = true
	#Radius used when checking for other nearby active threats.
	#Range: 0.0 ~ 128.0
	threatRadius = 24.0
	#Maximum distance between player and target for a kill camera.
	#Range: 1.0 ~ 256.0
	maxDistance = 256.0
	#Camera FOV during the kill camera. Lower values feel more cinematic.
	#Range: 10.0 ~ 120.0
	fov = 54.0
	#Hide HUD overlays during the kill camera.
	hideHud = true

#Skyrim-style dynamic ambient sound settings
[dynamicSounds]
	#Enable context-aware ambient one-shot sounds. Sound files must exist under assets/thuumcraft/sounds/dynamic/.
	enableDynamicAmbientSounds = true
	#Global volume multiplier for dynamic ambient sounds.
	#Range: 0.0 ~ 2.0
	volume = 0.65
	#How often dynamic ambient sounds are attempted. 0 disables playback; 1 is default; higher values play more often.
	#Range: 0.0 ~ 5.0
	frequency = 1.0

